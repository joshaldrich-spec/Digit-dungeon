<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Digit Dungeon">
<meta name="theme-color" content="#1b1426">
<title>Digit Dungeon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1b1426;--panel:#2a2038;--panel2:#3a2d4e;--line:#4e3d66;
  --stone:#3d2f52;--stone-hi:#463760;--wall:#271d36;--wall-hi:#5a4678;
  --cream:#fff3da;--paper:#fff8ea;--ink:#2a1f3a;--muted:#bfaed8;
  --gold:#ffc84a;--gold-d:#c98f12;--red:#ff5a6e;--red-d:#b8293f;--mint:#6fe0b0;--mint-d:#2e9c72;--blue:#3d8bff;
  --cell:60px;--pad:calc(var(--cell)*.42);
}
#scr-game[data-floor="2"]{--stone:#2e3c50;--stone-hi:#36475e;--wall:#1b2533;--wall-hi:#46607e}
#scr-game[data-floor="3"]{--stone:#472d3c;--stone-hi:#523647;--wall:#2b1a24;--wall-hi:#7a4660}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{position:fixed;inset:0;overflow:hidden;background:radial-gradient(130% 90% at 50% -10%,#33244a 0%,var(--bg) 60%);color:var(--cream);
  font-family:'Fredoka','Avenir Next Rounded','Arial Rounded MT Bold',ui-rounded,system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input{font:inherit;-webkit-user-select:text;user-select:text}
.screen{position:absolute;inset:0;display:none;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.screen.active{display:flex}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:18px;padding:14px 22px;font-weight:600;font-size:20px;background:var(--panel2);color:var(--cream);
  box-shadow:0 5px 0 #140e1c,inset 0 2px 0 rgba(255,255,255,.08);transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #140e1c}
.btn.gold{background:var(--gold);color:#3a2604;box-shadow:0 5px 0 var(--gold-d)}
.btn.mint{background:var(--mint);color:#0f3a2a;box-shadow:0 5px 0 var(--mint-d)}
.btn.red{background:var(--red);color:#fff;box-shadow:0 5px 0 var(--red-d)}
.btn.big{font-size:24px;padding:16px 30px;border-radius:22px}
.btn.small{font-size:15px;padding:9px 14px;border-radius:12px}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ---------- title ---------- */
#scr-title{flex-direction:column;align-items:center;justify-content:center}
.title-box{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;width:100%;max-width:420px}
.logo{font-weight:700;line-height:.86;font-size:clamp(50px,14vw,100px);text-transform:uppercase;letter-spacing:.02em}
.logo span{display:block}
.logo span:first-child{color:var(--gold);text-shadow:0 6px 0 #8a4f10,0 14px 26px rgba(0,0,0,.5)}
.logo span:last-child{color:var(--cream);text-shadow:0 6px 0 #5a4678,0 14px 26px rgba(0,0,0,.5)}
.title-hero{width:150px;height:150px;margin-top:4px;animation:bob 2.6s ease-in-out infinite}
.title-hero svg,.title-hero img{width:100%;height:100%}
.title-name{font-size:24px;font-weight:600;min-height:28px}
.title-stats{color:var(--muted);font-size:17px;min-height:22px}
.title-btns{display:flex;flex-direction:column;gap:14px;width:100%;max-width:300px;margin-top:8px}
.grownups-btn{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));background:transparent;border:2px solid var(--line);color:var(--muted);border-radius:12px;padding:8px 12px;font-size:14px;overflow:hidden}
.grownups-btn::after{content:'';position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--gold)}
.grownups-btn.holding::after{width:100%;transition:width 1.4s linear}

/* ---------- game layout ---------- */
#scr-game{flex-direction:column;gap:8px;touch-action:none}
.hud{display:flex;align-items:center;gap:8px;min-height:40px}
.hearts{display:flex;align-items:center;gap:1px;flex-wrap:wrap;max-width:46%}
.heart{width:26px;height:24px;display:block}
.shield{font-size:20px;margin-left:2px}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-weight:600;font-size:17px;white-space:nowrap}
.items{flex:1;min-width:0;display:flex;gap:1px;font-size:18px;overflow:hidden}
.icon-btn{width:42px;height:42px;border-radius:12px;border:0;background:var(--panel2);font-size:18px;box-shadow:0 3px 0 #140e1c;flex:none}
.rule{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:6px 10px 6px 6px;min-height:60px}
.rule.wiggle{animation:wiggle .45s}
.say{width:46px;height:46px;flex:none;border-radius:14px;border:0;background:var(--panel2);font-size:22px;box-shadow:0 3px 0 #140e1c}
.say:active{transform:translateY(2px);box-shadow:none}
.rule-text{flex:1;min-width:0}
.rule-text small{display:block;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rule-text small .lv{letter-spacing:.04em;text-transform:none;background:var(--panel2);border-radius:999px;padding:0 7px;margin-left:4px;color:var(--cream)}
.rule-text b{display:block;font-size:clamp(20px,5.6vw,30px);line-height:1.1;font-weight:700}
.pips{display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end;max-width:118px;flex:none}
.pip{width:13px;height:13px;border-radius:50%;border:2.5px solid var(--gold)}
.pip.on{background:var(--gold);box-shadow:0 0 8px rgba(255,200,74,.6)}
.stage{flex:1 1 0;min-height:0;position:relative}
.room{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:var(--pad);background:var(--wall);border-radius:calc(var(--cell)*.36);
  box-shadow:inset 0 0 0 4px var(--wall-hi),0 14px 34px rgba(0,0,0,.5);transition:opacity .15s}
.room.leave{opacity:0}
.room.shake{animation:shake .32s}
.grid{display:grid;grid-template-columns:repeat(5,var(--cell));grid-template-rows:repeat(5,var(--cell));border-radius:calc(var(--cell)*.16);overflow:hidden;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.cell{position:relative;background:var(--stone)}
.cell:nth-child(even){background:var(--stone-hi)}
.tile{position:absolute;inset:9%;border-radius:22%;background:var(--cream);color:var(--ink);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:calc(var(--cell)*.4);line-height:1;box-shadow:0 calc(var(--cell)*.06) 0 #c2a980;white-space:nowrap}
.tile.e3{font-size:calc(var(--cell)*.27)}
.tile.e4{font-size:calc(var(--cell)*.24)}
.tile.e5{font-size:calc(var(--cell)*.205)}
.tile.frame{inset:5%;border-radius:16%}
.tile.frame svg{width:94%;height:94%}
.tile.missed{opacity:.55;background:#d9c9b0}
.tile .rv{position:absolute;right:7%;bottom:5%;font-size:calc(var(--cell)*.17);color:var(--red-d);font-weight:700}
.tile.glow{box-shadow:0 0 0 3px var(--gold),0 0 18px 5px rgba(255,200,74,.85);animation:pulse .7s ease-in-out infinite alternate}
.tile.faded{opacity:.2}
.crumbs{position:absolute;inset:28%;opacity:.4;background:
  radial-gradient(circle at 25% 35%,var(--cream) 0 9%,transparent 10%),radial-gradient(circle at 70% 55%,var(--cream) 0 7%,transparent 8%),
  radial-gradient(circle at 45% 80%,var(--cream) 0 6%,transparent 7%),radial-gradient(circle at 60% 18%,var(--cream) 0 5%,transparent 6%)}
.door{position:absolute;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell)*.24);border:0;padding:0;z-index:4;background:transparent}
.door.n,.door.s{width:calc(var(--cell)*.9);height:var(--pad);left:50%;transform:translateX(-50%)}
.door.n{top:0;border-radius:calc(var(--cell)*.2) calc(var(--cell)*.2) 4px 4px}
.door.s{bottom:0;border-radius:4px 4px calc(var(--cell)*.2) calc(var(--cell)*.2)}
.door.e,.door.w{height:calc(var(--cell)*.9);width:var(--pad);top:50%;transform:translateY(-50%)}
.door.e{right:0;border-radius:4px calc(var(--cell)*.2) calc(var(--cell)*.2) 4px}
.door.w{left:0;border-radius:calc(var(--cell)*.2) 4px 4px calc(var(--cell)*.2)}
.door.none{display:none}
.door.closed{background:repeating-linear-gradient(90deg,#7a5234 0 6px,#5e3e26 6px 12px);box-shadow:inset 0 0 0 3px #3e2817}
.door.e.closed,.door.w.closed{background:repeating-linear-gradient(0deg,#7a5234 0 6px,#5e3e26 6px 12px)}
.door.open{background:#0b0710;box-shadow:inset 0 0 0 3px #8a6440,0 0 14px rgba(255,200,74,.4)}
.door.open.boss{box-shadow:inset 0 0 0 3px var(--red),0 0 16px rgba(255,90,110,.6)}
.door.open.treasure{box-shadow:inset 0 0 0 3px var(--gold),0 0 16px rgba(255,200,74,.7)}
.actors{position:absolute;left:var(--pad);top:var(--pad);width:calc(var(--cell)*5);height:calc(var(--cell)*5);pointer-events:none;z-index:2}
.actor{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);transition:transform .13s ease-out;will-change:transform}
.actor .spr{width:100%;height:100%}
.actor svg,.actor img{width:100%;height:100%;display:block}
.actor.hero{z-index:5}.actor.monster{z-index:4}.actor.pickup{z-index:3;padding:20%}.actor.prop{z-index:1}
.actor.hero .spr{animation:idle 2.2s ease-in-out infinite;transform-origin:50% 90%}
.actor.hero.left .spr > svg,.actor.hero.left .spr > div{transform:scaleX(-1)}
img{object-fit:contain}
.hero-art{position:relative;width:100%;height:100%}
.hero-art img,.hero-art svg{position:absolute;inset:0;width:100%;height:100%}
.actor.hero.chomping .spr{animation:chompA .24s ease-out}
.actor.hero.hurt{animation:blink .12s 6 steps(1)}
.actor.monster .spr{animation:bob 1.1s ease-in-out infinite}
.actor.pickup .spr{animation:bob 1.4s ease-in-out infinite}
.actor.prop.trap .spr{animation:pulse 1s ease-in-out infinite alternate}
.float{position:absolute;transform:translate(-50%,0);font-weight:700;font-size:calc(var(--cell)*.3);color:var(--gold);text-shadow:0 2px 0 #000;white-space:nowrap;animation:floatUp .9s ease-out forwards;z-index:9;pointer-events:none}
.poof{position:absolute;width:var(--cell);height:var(--cell);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell)*.6);animation:poof .5s ease-out forwards;z-index:6}
.room-msg{position:absolute;left:var(--pad);top:var(--pad);width:calc(var(--cell)*5);height:calc(var(--cell)*2.6);display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:3;padding:4%}
.room-msg .in{background:rgba(15,9,24,.72);border-radius:16px;padding:10px 14px;text-align:center;font-size:calc(var(--cell)*.3);line-height:1.25}
.room-msg .in small{display:block;font-size:calc(var(--cell)*.22);color:var(--muted);margin-top:4px}

.infobar{display:flex;gap:8px;align-items:stretch;min-height:76px}
.peek{flex:1;min-width:0;background:var(--panel);border:2px solid var(--line);border-radius:16px;display:flex;align-items:center;gap:10px;padding:6px 10px}
.peek-say{width:38px;height:38px;flex:none;border-radius:12px;border:0;background:var(--panel2);font-size:17px}
.peek-label{font-size:30px;font-weight:700;white-space:nowrap;min-width:56px;text-align:center}
.peek-label svg{height:46px;width:auto}
.peek-model{flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
.paper{background:var(--paper);border-radius:12px;padding:6px;display:flex;justify-content:center;align-items:center;max-width:100%}
.peek-model .paper svg{height:52px;width:auto;max-width:100%;display:block}
.peek-lock{font-size:14px;color:var(--muted);line-height:1.25}
.peek-hint{font-size:16px;color:var(--muted);line-height:1.25}
.mapbox{flex:none;width:96px;background:var(--panel);border:2px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.mm{position:relative;flex:none}
.mmr{position:absolute;border-radius:3px;display:flex;align-items:center;justify-content:center}
.mmr.vis{background:#8f7cb0}
.mmr.kn{border:2px solid #6b5a88}
.mmr.cur{background:var(--cream);box-shadow:0 0 8px rgba(255,243,218,.7)}
.mmr i{font-style:normal;font-size:9px;line-height:1}

.controls{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dpad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,50px);gap:5px}
.dbtn{border:0;border-radius:14px;background:var(--panel2);font-size:22px;color:var(--cream);box-shadow:0 4px 0 #140e1c}
.dbtn.pressed{transform:translateY(3px);box-shadow:0 1px 0 #140e1c;background:#4a3a62}
.dbtn.up{grid-area:1/2}.dbtn.left{grid-area:2/1}.dbtn.right{grid-area:2/3}.dbtn.down{grid-area:3/2}
.act{display:flex;align-items:center;gap:12px}
.chomp{width:120px;height:120px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff8a99,var(--red) 62%);color:#fff;font-weight:700;font-size:21px;letter-spacing:.04em;
  box-shadow:0 7px 0 var(--red-d),0 12px 24px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.chomp.pressed{transform:translateY(5px);box-shadow:0 2px 0 var(--red-d)}
.chomp .mouth{width:42px;height:20px;background:#3a1028;border-radius:0 0 22px 22px;position:relative;overflow:hidden}
.chomp .mouth::before,.chomp .mouth::after{content:'';position:absolute;top:0;width:9px;height:7px;background:#fff;border-radius:0 0 3px 3px}
.chomp .mouth::before{left:10px}.chomp .mouth::after{right:10px}
.glow-btn{height:42px;border-radius:12px;border:0;background:var(--gold);color:#3a2604;font-size:18px;font-weight:700;padding:0 10px;box-shadow:0 3px 0 var(--gold-d);flex:none;display:flex;align-items:center;gap:2px}
.glow-btn small{font-size:15px}
@media (max-height:740px) and (orientation:portrait){
  .dpad{grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,42px)}
  .chomp{width:98px;height:98px;font-size:17px}
  .infobar{min-height:62px}.rule{min-height:52px}.peek-label{font-size:24px}
}
@media (orientation:landscape) and (min-width:700px){
  #scr-game.active{display:grid;grid-template-columns:minmax(180px,23%) 1fr minmax(180px,23%);grid-template-rows:auto auto 1fr auto;
    grid-template-areas:"hud hud hud" "rule rule rule" "peek stage map" "dpad stage act";gap:10px 14px}
  .hud{grid-area:hud}.rule{grid-area:rule}.stage{grid-area:stage}
  .infobar,.controls{display:contents}
  .peek{grid-area:peek;flex-direction:column;align-self:start;justify-content:center;text-align:center;min-height:140px;padding:10px}
  .mapbox{grid-area:map;align-self:start;width:auto;height:140px}
  .dpad{grid-area:dpad;justify-self:center;align-self:end;grid-template-columns:repeat(3,66px);grid-template-rows:repeat(3,58px)}
  .act{grid-area:act;justify-self:center;align-self:end;flex-direction:column-reverse}
  .chomp{width:136px;height:136px;font-size:23px}
}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,6,16,.74);display:none;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));z-index:50}
.overlay.show{display:flex}
.card{background:var(--panel);border:3px solid var(--line);border-radius:24px;padding:18px 18px 20px;max-width:520px;width:100%;max-height:100%;overflow:auto;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.55);-webkit-overflow-scrolling:touch}
.overlay.show .card{animation:pop .22s ease-out}
.card h2{margin:4px 0 8px;font-size:28px;line-height:1.1}
.card h3{margin:16px 0 8px;font-size:18px;color:var(--gold);text-align:left}
.card p{font-size:20px;line-height:1.35;margin:8px 0}
.card .sub{color:var(--muted);font-size:16px}
.card.shake{animation:cshake .3s}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.coach-head{display:flex;align-items:center;justify-content:center;gap:10px}
.coach-head h2{margin:0}
.model{margin:12px auto;max-width:380px}
.model .paper{padding:12px}
.model svg{max-width:100%;height:auto;max-height:170px}
.strat{display:inline-block;background:var(--mint);color:#0f3a2a;border-radius:999px;padding:1px 10px;font-weight:700;font-size:16px;margin-right:4px;vertical-align:2px}
.need{color:var(--muted);font-size:17px!important}
.howto{display:flex;flex-direction:column;gap:10px;text-align:left;margin:12px 0 18px}
.howto div{display:flex;align-items:center;gap:12px;font-size:19px;line-height:1.25}
.howto .n{flex:none;width:38px;height:38px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px}
.chompword{background:var(--red);color:#fff;border-radius:8px;padding:0 6px}
.offers{display:flex;gap:12px;margin:12px 0}
.offer{flex:1;border:0;border-radius:18px;background:var(--panel2);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 #140e1c;color:var(--cream)}
.offer:active{transform:translateY(3px);box-shadow:0 2px 0 #140e1c}
.offer .ic{font-size:46px;line-height:1.1}
.offer b{font-size:18px}
.offer span{font-size:14px;color:var(--muted);line-height:1.25}
.offer .price{font-size:20px;font-weight:700;color:var(--gold)}
.offer[disabled]{opacity:.4}
.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.ch{width:84px;height:84px;border-radius:20px;border:0;background:var(--cream);color:var(--ink);font-size:38px;font-weight:700;box-shadow:0 6px 0 #c2a980}
.ch:active{transform:translateY(4px);box-shadow:0 2px 0 #c2a980}
.ch[disabled]{opacity:.28;pointer-events:none}
.hint{background:rgba(255,200,74,.12);border:2px solid rgba(255,200,74,.45);border-radius:14px;padding:10px 12px;font-size:18px!important}
.name-hero{width:120px;height:120px;margin:0 auto}
.name-in{width:100%;max-width:300px;font-size:26px;text-align:center;padding:12px;border-radius:14px;border:3px solid var(--line);background:var(--paper);color:var(--ink);margin:8px 0 16px;outline:none}
.closet-hero{width:130px;height:130px;margin:0 auto}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw{border:3px solid transparent;border-radius:16px;background:var(--panel2);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;color:var(--cream)}
.sw.sel{border-color:var(--gold)}
.sw[disabled]{opacity:.5}
.sw .dot{width:34px;height:34px;border-radius:50%;border:3px solid rgba(0,0,0,.25)}
.sw svg{width:46px;height:34px}
.sumgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.sumgrid div{background:var(--panel2);border-radius:14px;padding:8px 4px}
.sumgrid b{display:block;font-size:26px}
.sumgrid span{font-size:13px;color:var(--muted)}
.trophy{font-size:72px;line-height:1}
.mind{color:var(--mint)}
/* boss */
.card.boss-card{max-width:560px;background:radial-gradient(120% 70% at 50% 0%,#4a2b55,#221830);border-color:#7a4660}
.boss-hearts{display:flex;justify-content:center;gap:1px;margin-bottom:2px}
.boss-spr{width:min(42vw,180px);margin:0 auto;animation:bob 1.6s ease-in-out infinite}
.boss-spr svg,.boss-spr img{width:100%;height:auto;display:block}
.boss-spr.flash svg,.boss-spr.flash img{animation:flash .45s}
.boss-wrap.won .boss-spr{animation:defeat .9s ease-in forwards}
.boss-name{font-size:24px;font-weight:700;color:var(--gold)}
.boss-hp{display:inline-flex;align-items:baseline;gap:8px;background:rgba(0,0,0,.3);border-radius:999px;padding:2px 14px;margin:4px 0}
.boss-hp span{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.boss-hp b{font-size:28px;color:var(--red)}
.rack svg{width:100%;max-width:300px;height:auto}
.bead-gone{animation:beadOut .55s ease-out}
.attacks{display:flex;gap:10px;justify-content:center;margin:8px 0}

.atk:active{transform:translateY(3px);box-shadow:0 2px 0 #140e1c}
.atk .ai{font-size:32px;line-height:1.1}.atk b{font-size:17px}.atk .ak{font-size:26px;font-weight:700;color:var(--gold)}
.boss-q{font-size:42px!important;font-weight:700;margin:8px 0!important}
.qmark{color:var(--gold)}
/* grown-ups */
.gu{text-align:left}
.gu table{width:100%;border-collapse:collapse;font-size:15px}
.gu th{color:var(--muted);font-weight:500;text-align:left;padding:4px}
.gu td{padding:6px 4px;border-top:1px solid var(--line)}
.gu td.n{text-align:right;font-variant-numeric:tabular-nums}
.acc-hi{color:var(--good,#7be38f)}.acc-mid{color:var(--gold)}.acc-lo{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border-radius:999px;padding:4px 10px;font-size:15px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:16px}

.banner .bi{font-size:54px;line-height:1.1}.banner .bt{font-size:28px;font-weight:700;color:var(--gold)}.banner .bs{font-size:18px}
.fx{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.conf{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}

@keyframes bob{50%{transform:translateY(-6%)}}
@keyframes idle{50%{transform:scaleY(.95) translateY(2%)}}

<body>
<div id="app">

    </div>
  </div>

<script>
'use strict';
/* =====================================================================
   DIGIT DUNGEON — a math roguelite for 2nd grade
   Curriculum: Bridges in Mathematics, Grade 2, Unit 1 "Figuring the Facts"
   (facts to 20, doubles, make ten, add ten, ten-frames, number rack,
    skip counting by 2s/5s/10s, even & odd)
   ===================================================================== */

/* ---------- ART ----------------------------------------------------
   The Gemini art is embedded at the bottom of this file (ART_DATA) as
   background-free images, so the whole game is this one file. Any
   piece missing from ART_DATA falls back to the built-in drawing.
   hero / heroChomp hold one image per Closet color.
---------------------------------------------------------------------- */
const ART = {};

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mean = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0;
const uid = () => Math.random().toString(36).slice(2, 9);
const strip = s => String(s).replace(/<[^>]+>/g, '');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function weightedPick(items, wf) {
  let tot = 0; const ws = items.map(i => { const w = Math.max(0, wf(i)); tot += w; return w; });
  if (tot <= 0) return pick(items);
  let r = Math.random() * tot;
  for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}
function sampleW(arr, k, wf) { const pool = arr.slice(), out = []; while (out.length < k && pool.length) { const it = weightedPick(pool, wf); out.push(it); pool.splice(pool.indexOf(it), 1); } return out; }
function takeCycle(arr, k) { const out = []; if (!arr.length) return out; let i = 0; while (out.length < k) { out.push(arr[i % arr.length]); i++; if (i % arr.length === 0) shuffle(arr); } return out; }
function today() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
const show = s => s.replace(/ ([+−]) /g, ' $1 ');

/* ---------- save data ---------- */
const SAVE_KEY = 'digit-dungeon-v1';
function defaultSave() {
  return { v: 1, name: '', stars: 0, cosmetics: { color: 'mint', hat: 'none' }, unlocks: [], best: { floor: 0, wins: 0 },
    runsPlayed: 0, roomCount: 0, tutorialDone: false, skills: {}, facts: {}, days: {},
    settings: { voice: true, sound: true, mistakes: true, monsters: true, readTiles: false,
      skills: { frames: true, evenOdd: true, skip10: true, skip5: true, skip2: true, add: true, sub: true } },
    run: null };
}
function merge(base, over) { for (const k in over) { if (over[k] && typeof over[k] === 'object' && !Array.isArray(over[k]) && base[k] && typeof base[k] === 'object') merge(base[k], over[k]); else base[k] = over[k]; } return base; }
function loadSave() { try { const raw = localStorage.getItem(SAVE_KEY); if (raw) return merge(defaultSave(), JSON.parse(raw)); } catch (e) {} return defaultSave(); }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
let save = loadSave();

/* ---------- sound ---------- */
const Sound = {
  ctx: null,
  init() { if (this.ctx) return; try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} },
  tone(f, d, type = 'square', vol = .08, slide = 0, delay = 0) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .03);
  },
  play(n) {
    if (!save.settings.sound || !this.ctx) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const T = this.tone.bind(this);
    switch (n) {
      case 'tap': T(660, .04, 'triangle', .04); break;
      case 'step': T(230, .05, 'triangle', .05); break;
      case 'bump': T(95, .08, 'square', .05); break;
      case 'chomp': T(190, .07, 'square', .08, -90); T(270, .08, 'square', .07, -130, .07); break;
      case 'good': [523, 659, 784].forEach((f, i) => T(f, .12, 'triangle', .08, 0, i * .07)); break;
      case 'bad': T(210, .28, 'sawtooth', .05, -100); break;
      case 'hurt': T(340, .3, 'square', .07, -260); break;
      case 'coin': T(988, .06, 'square', .05); T(1319, .12, 'square', .05, 0, .06); break;
      case 'door': T(140, .3, 'triangle', .08, 140); break;
      case 'clear': [392, 523, 659, 784, 1047].forEach((f, i) => T(f, .14, 'triangle', .08, 0, i * .08)); break;
      case 'item': [523, 784, 1047, 1319].forEach((f, i) => T(f, .2, 'sine', .09, 0, i * .1)); break;
      case 'boss': T(110, .5, 'sawtooth', .06, -40); T(82, .6, 'sawtooth', .05, -20, .25); break;
      case 'hit': T(620, .1, 'square', .08, -420); T(300, .15, 'triangle', .07, -150, .08); break;
      case 'win': [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => T(f, .18, 'triangle', .09, 0, i * .11)); break;
    }
  }
};

/* ---------- read-aloud ---------- */
function mathSpeech(t) {
  return strip(t).replace(/\p{Extended_Pictographic}|️/gu, '')
    .replace(/ \? /g, ' what ').replace(/−/g, ' minus ').replace(/\+/g, ' plus ').replace(/=/g, ' equals ').replace(/ /g, ' ').replace(/…/g, '');
}
const Voice = {
  v: null, unlocked: false,
  pick() { try { const vs = speechSynthesis.getVoices(); const pref = ['Samantha', 'Karen', 'Moira', 'Google US English', 'Aria', 'Jenny'];
    this.v = pref.map(n => vs.find(v => v.name.includes(n) && /^en/i.test(v.lang))).find(Boolean) || vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; } catch (e) {} },
  unlock() { if (this.unlocked || !('speechSynthesis' in window)) return; this.unlocked = true; try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} },
  say(text) {
    if (!save.settings.voice || !('speechSynthesis' in window) || !text) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(mathSpeech(text)); if (!this.v) this.pick(); if (this.v) u.voice = this.v; u.rate = .95; u.pitch = 1.1; speechSynthesis.speak(u); } catch (e) {}
  },
  stop() { try { speechSynthesis.cancel(); } catch (e) {} }
};
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => Voice.pick();
document.addEventListener('pointerdown', () => { Sound.init(); if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume(); Voice.unlock(); }, true);

/* =====================================================================
   CURRICULUM
   ===================================================================== */
const SKILLS = {
  frames:  { name: 'Ten-frame quick looks', short: 'Ten-frames', max: 3 },
  evenOdd: { name: 'Even & odd', short: 'Even & odd', max: 3 },
  skip10:  { name: 'Counting by 10s', short: 'By 10s', max: 2 },
  skip5:   { name: 'Counting by 5s', short: 'By 5s', max: 2 },
  skip2:   { name: 'Counting by 2s', short: 'By 2s', max: 3 },
  add:     { name: 'Addition facts to 20', short: 'Adding', max: 4 },
  sub:     { name: 'Take-away facts to 20', short: 'Take-away', max: 3, gate: () => sk('add').level >= 2, gateText: 'starts once Adding reaches level 2' },
};
const LEVEL_NOTES = {
  frames: ['1–10, one frame', 'teens: a ten and some more', 'any split, up to 20'],
  evenOdd: ['up to 10', 'up to 20', 'up to 40'],
  skip10: ['10, 20, 30…', 'from any number (3, 13, 23…)'],
  skip5: ['to 50', 'to 100'],
  skip2: ['to 20', 'to 40', 'from 1 (odd numbers)'],
  add: ['sums to 10: +0/1/2, doubles, ten-friends', 'doubles to 20, +10, count on', 'near doubles, +9', 'all facts to 20'],
  sub: ['within 10: −1/2/3, halves', 'teens: −10, back to ten', 'all facts to 20'],
};
function sk(id) { return save.skills[id] || (save.skills[id] = { level: 1, recent: [], correct: 0, tries: 0, last: -99 }); }
function availableSkills() {
  const ids = Object.keys(SKILLS).filter(id => save.settings.skills[id] !== false && (!SKILLS[id].gate || SKILLS[id].gate()));
  return ids.length ? ids : ['add'];
}
function recentAcc(id, n = 12, dflt = .8) { const r = sk(id).recent.slice(-n); return r.length >= 4 ? mean(r) : dflt; }

/* Interleaved + weakness-weighted + spaced skill choice */
function pickSkill() {
  const ids = availableSkills();
  return weightedPick(ids, id => {
    const s = sk(id);
    let w = 1 + clamp(.9 - recentAcc(id), -.3, .6) * 2.5;
    if (id === 'add') w *= 2.2; if (id === 'sub') w *= 1.4;
    if (id === run.lastSkill && ids.length > 1) w *= .15;
    const since = save.roomCount - s.last; w *= 1 + clamp(since, 0, 8) * .08;
    return Math.max(.05, w);
  });
}

/* --- fact pools (ordered facts so turnaround facts both appear) --- */
function addPool(level) {
  const out = [];
  for (let a = 0; a <= 10; a++) for (let b = 0; b <= 10; b++) {
    const s = a + b, mn = Math.min(a, b); if (s === 0) continue;
    let ok = s <= 10 && (mn <= 2 || a === b || s === 10);
    if (level >= 2 && (a === b || a === 10 || b === 10 || mn <= 3)) ok = true;
    if (level >= 3 && (Math.abs(a - b) === 1 || a === 9 || b === 9 || s <= 10)) ok = true;
    if (level >= 4) ok = true;
    if (ok) out.push({ a, b, op: '+', val: s });
  }
  return out;
}
function subPool(level) {
  const out = [];
  for (let a = 1; a <= 20; a++) for (let b = 0; b <= 10; b++) {
    const r = a - b; if (r < 0 || r > 10) continue;
    let ok = a <= 10 && (b <= 3 || a === 2 * b || a === 10);
    if (level >= 2 && a > 10 && (b === 10 || b === a - 10 || a === 2 * b || b <= 3)) ok = true;
    if (level >= 3) ok = true;
    if (ok) out.push({ a, b, op: '−', val: r });
  }
  return out;
}
const factKey = f => `${f.a}${f.op === '+' ? '+' : '-'}${f.b}`;
const BOX_W = { 1: 5, 2: 3, 3: 2, 4: 1.2, 5: .7 };
function factWeight(f) { const r = save.facts[factKey(f)]; return BOX_W[r ? r.b : 2]; }

/* --- rule builders: each returns {rule, tiles} --- */
function ruleEquals(skill, level, nC, nT) {
  const op = skill === 'add' ? '+' : '−';
  const pool = skill === 'add' ? addPool(level) : subPool(level);
  const byVal = {}; pool.forEach(f => (byVal[f.val] = byVal[f.val] || []).push(f));
  const [lo, hi] = skill === 'add' ? [[5, 10], [6, 20], [8, 18], [10, 18]][level - 1] : [[1, 7], [2, 10], [3, 10]][level - 1];
  let vals = Object.keys(byVal).map(Number).filter(v => v >= lo && v <= hi && byVal[v].length >= Math.min(nC, 4));
  if (!vals.length) vals = Object.keys(byVal).map(Number);
  const N = weightedPick(vals, v => mean(byVal[v].map(factWeight)) * (v === run.lastTarget ? .15 : 1) * (skill === 'add' && v === 10 && level <= 2 ? 1.6 : 1));
  run.lastTarget = N;
  const correct = sampleW(byVal[N], Math.min(nC, byVal[N].length), factWeight);
  const near = pool.filter(f => f.val !== N && Math.abs(f.val - N) <= 2);
  let dis = sampleW(near, nT - correct.length, f => (Math.abs(f.val - N) === 1 ? 2.5 : 1.2) * factWeight(f));
  if (dis.length < nT - correct.length) dis = dis.concat(sampleW(pool.filter(f => f.val !== N && !dis.includes(f)), nT - correct.length - dis.length, () => 1));
  const tile = (f, ok) => ({ kind: 'fact', label: `${f.a} ${f.op} ${f.b}`, value: f.val, correct: ok, a: f.a, b: f.b, op: f.op });
  return {
    rule: { skill, kind: 'equals', op, target: N, title: `Make ${N}`, speak: skill === 'add' ? `Chomp the facts that make ${N}!` : `Chomp the take-away facts that make ${N}!` },
    tiles: [...correct.map(f => tile(f, true)), ...dis.map(f => tile(f, false))]
  };
}
function ruleParity(level, nC, nT) {
  const max = [10, 20, 40][level - 1], want = Math.random() < .5 ? 'even' : 'odd';
  const isW = n => (n % 2 === 0) === (want === 'even');
  const nums = []; for (let n = 1; n <= max; n++) nums.push(n);
  const good = takeCycle(shuffle(nums.filter(isW)), nC), bad = takeCycle(shuffle(nums.filter(n => !isW(n))), nT - nC);
  const t = (n, ok) => ({ kind: 'num', label: String(n), value: n, correct: ok });
  return { rule: { skill: 'evenOdd', kind: 'parity', want, title: want === 'even' ? 'Even numbers' : 'Odd numbers', speak: `Chomp the ${want} numbers!` },
    tiles: [...good.map(n => t(n, true)), ...bad.map(n => t(n, false))] };
}
function ruleSkip(step, level, nC, nT) {
  let start = step, max, offset = 0;
  if (step === 10) { if (level === 1) max = 100; else { offset = rnd(1, 9); start = offset; max = offset + 90; } }
  if (step === 5) max = level === 1 ? 50 : 100;
  if (step === 2) { if (level === 1) max = 20; else if (level === 2) max = 40; else { offset = 1; start = 1; max = 31; } }
  const seq = []; for (let v = start; v <= max; v += step) seq.push(v);
  const inSeq = n => n >= start && n <= max && (n - start) % step === 0;
  const cand = new Set();
  seq.forEach(v => [-2, -1, 1, 2, step === 10 ? 5 : 3].forEach(d => { const n = v + d; if (n >= 1 && n <= max + 2 && !inSeq(n)) cand.add(n); }));
  const good = takeCycle(shuffle(seq.slice()), nC), bad = takeCycle(shuffle([...cand]), nT - nC);
  const t = (n, ok) => ({ kind: 'num', label: String(n), value: n, correct: ok });
  const from = offset ? ` from ${offset}` : '';
  return { rule: { skill: 'skip' + step, kind: 'skip', step, start, max, offset, title: `Count by ${step}s${from}`, speak: `Chomp the numbers we say when we count by ${step}s${from}!` },
    tiles: [...good.map(n => t(n, true)), ...bad.map(n => t(n, false))] };
}
function frameSegs(v, level) {
  if (level === 2 && v > 10) return [{ n: 10, cls: 'a' }, { n: v - 10, cls: 'b' }];

const countList = (from, n, dir) => Array.from({ length: n }, (_, i) => from + dir * (i + 1)).join(', ');
function addStrategy(a, b) {

  if (small === 0) return { name: 'Zero', text: `Adding 0 keeps a number the same. ${a} + ${b} = ${s}.` };
  if (a === b) return { name: 'Doubles', text: `It's a double! Double ${a} is ${s}.` };
  if (s === 10) return { name: 'Make ten', text: `${a} and ${b} are ten-friends. Together they fill the ten frame: 10!` };
  if (big === 10) return { name: 'Add ten', text: `A full ten and ${small} more makes ${s}.` };
  if (Math.abs(a - b) === 1) return { name: 'Near double', text: `Use a double: ${small} + ${small} = ${2 * small}. One more is ${s}.` };
  if (small <= 2) return { name: 'Count on', text: `Start at ${big} and count on ${small}: ${countList(big, small, 1)}. So ${a} + ${b} = ${s}.` };
  if (s > 10) { const need = 10 - big; return { name: 'Make ten', text: `${big} needs ${need} more to make 10. Take ${need} from the ${small}: 10 + ${small - need} = ${s}.` }; }
  return { name: 'Count on', text: `Start at the bigger number, ${big}, and count on ${small}: ${countList(big, small, 1)}. So ${a} + ${b} = ${s}.` };
}
function subStrategy(a, b) {
  const r = a - b;
  if (b === 0) return { name: 'Zero', text: `Taking away 0 leaves all ${a}.` };
  if (r === 0) return { name: 'All gone', text: `Take away all ${a} and nothing is left: 0.` };
  if (a === 2 * b) return { name: 'Doubles', text: `${b} + ${b} = ${a}, so half of ${a} is ${b}. ${a} − ${b} = ${b}.` };
  if (a > 10 && a <= 20 && b === 10) return { name: 'Take ten', text: `${a} is a ten and ${a - 10} more. Take away the ten and ${r} are left.` };
  if (a > 10 && a <= 20 && b === a - 10) return { name: 'Back to ten', text: `${a} is a ten and ${b} more. Take away the ${b} extras and 10 is left.` };
  if (b <= 3) return { name: 'Count back', text: `Start at ${a} and count back ${b}: ${countList(a, b, -1)}. So ${a} − ${b} = ${r}.` };
  if (a > 10 && a <= 20 && b > a - 10) { const first = a - 10, rest = b - first; return { name: 'Down to ten', text: `Take ${first} to get to 10. Then take ${rest} more: 10 − ${rest} = ${r}.` }; }

/* ---------- boss: number-rack take-away ---------- */

function bossMoves(hp) {
  const c = [];
  if (hp > 10) c.push({ id: 'ten', icon: '💥', name: 'Ten Smash', k: 10 });

  if (hp % 2 === 0 && hp >= 4) c.push({ id: 'half', icon: '🌗', name: 'Half Chomp', k: hp / 2 });
  if (hp <= 5) c.push({ id: 'final', icon: '⭐', name: 'Final Chomp', k: hp });
  if (hp > 3) c.push({ id: 'zap', icon: '⚡', name: 'Zap', k: rnd(2, Math.min(4, hp - 1)) });
  if (hp >= 11 && run.floor >= 2 && hp - 9 <= 9) c.push({ id: 'boom', icon: '💣', name: 'Big Boom', k: rnd(hp - 9, 9) });
  const out = []; for (const m of shuffle(c)) { if (!out.some(o => o.k === m.k)) out.push(m); if (out.length === 2) break; }
  return out;
}
function bossHint(hp, m) {
  const r = hp - m.k;
  if (m.id === 'ten') return `Slide away the whole top row of 10. ${hp} is a ten and ${hp - 10} more, so ${r} are left.`;
  if (m.id === 'ones') return `Take away the ${m.k} beads on the bottom row. Just the full ten is left: 10!`;
  if (m.id === 'half') return `Half of ${hp}: ${m.k} + ${m.k} = ${hp}. So ${hp} − ${m.k} = ${m.k}.`;
  if (m.id === 'final') return `Take away all ${hp} beads. Nothing is left: 0!`;
  return subStrategy(hp, m.k).text;
}

  else if (b.step === 'answer') body = `<p class="boss-q">${b.hp} − ${b.move.k} = <span class="qmark">?</span></p><div class="choices">${b.choices.map(v => `<button class="ch" data-act="ans" data-v="${v}" ${b.wrong.includes(v) ? 'disabled' : ''}>${v}</button>`).join('')}</div>${b.hint ? `<p class="hint">💡 ${b.hint}</p>` : ''}`;

/* ---------- end of run ---------- */

  const prac = Object.entries(r.bySkill).sort((a, b) => (b[1].c + b[1].w) - (a[1].c + a[1].w)).map(([k]) => SKILLS[k] ? SKILLS[k].short : 'Boss take-away').slice(0, 4).join(', ');
  const newU = unlocksBetween(r.startStars, save.stars);

    <div class="sumgrid"><div><b>${r.floor}</b><span>floor</span></div><div><b>${r.roomsCleared}</b><span>rooms</span></div><div><b>${r.correct}</b><span>right</span></div><div><b>+${r.stars}</b><span>⭐ kept</span></div></div>
    ${prac ? `<p class="sub">You practiced: ${prac}${tot ? ` · ${acc}% right` : ''}</p>` : ''}
    ${newU.length ? `<p>🎁 New in the Closet: <b>${newU.join(', ')}</b></p>` : ''}
    <p class="mind">${won ? 'You did it! Every room made your brain stronger.' : pick(['Every run makes your brain stronger.', 'Mistakes are how brains grow. One more try?', 'You got better this run!'])}</p>
    <div class="stack"><button class="btn mint big" data-act="again">Play again</button><button class="btn" data-act="home">Home</button></div>`,
    { actions: { again: () => { closeOverlay(); newRun(); }, home: () => { closeOverlay(); showTitle(); } } });

function unlocksBetween(a, b) {
  const out = [];

}

}
function closeOverlay() { $('#ov').classList.remove('show'); const cb = ovState && ovState.onClose; ovState = null; if (run) run.tick = Date.now(); if (cb) cb(); }
const toasts = []; let toasting = false;
function toast(m) { toasts.push(m); if (!toasting) nextToast(); }
function nextToast() {
  const m = toasts.shift(); if (!m) { toasting = false; return; }
  toasting = true; const el = $('#toast'); el.textContent = m; el.classList.add('show');
  setTimeout(() => { el.classList.remove('show'); setTimeout(nextToast, 260); }, 1900);
}
let bannerT = null;
function banner(icon, title, sub) {

}
function confetti() {
  const fx = $('#fx'), bits = ['⭐', '✨', '🎉', '🪙', '💖'];
  for (let i = 0; i < 36; i++) { const s = document.createElement('span'); s.className = 'conf'; s.textContent = pick(bits); s.style.left = Math.random() * 100 + 'vw'; s.style.animationDuration = (1.6 + Math.random() * 1.6) + 's'; s.style.animationDelay = Math.random() * .6 + 's'; fx.appendChild(s); setTimeout(() => s.remove(), 4000); }
}

/* ---------- title, name, closet ---------- */
function showTitle() {

function askName(then) {
  openOverlay(`<h2>Name your hero!</h2><div class="name-hero">${heroSVG()}</div><input class="name-in" id="name-in" maxlength="14" placeholder="Hero name" autocomplete="off" autocapitalize="words" value="${esc(save.name)}"><br><button class="btn mint big" data-act="ok">Let's go!</button>`,
    { actions: { ok: () => { save.name = ($('#name-in').value.trim() || 'Hero').slice(0, 14); persist(); closeOverlay(); then && then(); } } });
  Voice.say('Name your hero!');
  setTimeout(() => { const i = $('#name-in'); if (i) i.focus(); }, 120);
}
function openCloset() {
  const sw = Object.entries(COLORS).map(([k, c]) => { const lock = save.stars < c.need;
    return `<button class="sw ${save.cosmetics.color === k ? 'sel' : ''}" data-act="color" data-k="${k}" ${lock ? 'disabled' : ''}><span class="dot" style="background:${c.c}"></span>${lock ? `🔒 ${c.need}⭐` : c.name}</button>`; }).join('');
  const hats = Object.entries(HATS).map(([k, h]) => { const lock = save.stars < h.need;
    return `<button class="sw ${save.cosmetics.hat === k ? 'sel' : ''}" data-act="hat" data-k="${k}" ${lock ? 'disabled' : ''}><svg viewBox="16 -2 68 38">${k === 'none' ? '<text x="50" y="26" text-anchor="middle" font-size="22" fill="#bfaed8">—</text>' : hatSVG(k)}</svg>${lock ? `🔒 ${h.need}⭐` : h.name}</button>`; }).join('');
  openOverlay(`<h2>👕 Closet</h2><div class="closet-hero">${heroSVG()}</div><p class="sub">⭐ ${save.stars} stars · earn more by chomping!</p><h3>Colors</h3><div class="swatches">${sw}</div><h3>Hats</h3><div class="swatches">${hats}</div><div class="stack"><button class="btn mint" data-close>Done</button></div>`,
    { actions: { color: el => { save.cosmetics.color = el.dataset.k; persist(); openCloset(); }, hat: el => { save.cosmetics.hat = el.dataset.k; persist(); openCloset(); } },
      onClose: () => $('#title-hero').innerHTML = heroSVG() });
}

/* ---------- grown-ups panel ---------- */
function openGrownups() {
  const rows = [...Object.keys(SKILLS), 'rack'].map(id => {
    const s = sk(id), r = s.recent, acc = r.length ? Math.round(mean(r) * 100) : null;
    const on = id === 'rack' || save.settings.skills[id] !== false, gated = SKILLS[id] && SKILLS[id].gate && !SKILLS[id].gate();
    const name = id === 'rack' ? 'Boss take-away (number rack)' : SKILLS[id].name;
    const lvl = id === 'rack' ? '—' : `${s.level}/${SKILLS[id].max}`;
    const note = id === 'rack' ? '' : `<br><small style="color:var(--muted)">${!on ? 'off' : gated ? SKILLS[id].gateText : LEVEL_NOTES[id][s.level - 1]}</small>`;
    return `<tr><td>${name}${note}</td><td class="n">${lvl}</td><td class="n ${acc === null ? '' : acc >= 85 ? 'acc-hi' : acc >= 65 ? 'acc-mid' : 'acc-lo'}">${acc === null ? '—' : acc + '%'}</td><td class="n">${s.tries}</td></tr>`;
  }).join('');
  const tricky = Object.entries(save.facts).filter(([, f]) => f.w > 0 && f.b <= 2).sort((a, b) => b[1].w - a[1].w).slice(0, 12)
    .map(([k, f]) => `<span class="chip">${k.replace('+', ' + ').replace('-', ' − ')} <small style="color:var(--muted)">missed ${f.w}</small></span>`).join('');
  const days = Object.entries(save.days).sort((a, b) => b[0].localeCompare(a[0])).slice(0, 7).map(([d, v]) => {
    const t = v.c + v.w, dt = new Date(d + 'T12:00:00');
    return `<div class="sess">${dt.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })} · ${Math.max(1, Math.round(v.ms / 60000))} min · ${v.c} right / ${v.w} oops${t ? ` (${Math.round(100 * v.c / t)}%)` : ''}</div>`;
  }).join('');
  const tg = (k, label, sub) => `<label class="tg"><span>${label}${sub ? `<small>${sub}</small>` : ''}</span><input type="checkbox" data-set="${k}" ${save.settings[k] ? 'checked' : ''}></label>`;
  const stg = id => `<label class="tg"><span>${SKILLS[id].name}${SKILLS[id].gate ? `<small>${SKILLS[id].gateText}</small>` : ''}</span><input type="checkbox" data-skill="${id}" ${save.settings.skills[id] !== false ? 'checked' : ''}></label>`;
  openOverlay(`<div class="gu"><h2 style="text-align:center">Grown-ups</h2><p class="sub" style="text-align:center">Bridges Grade 2 · Unit 1 "Figuring the Facts"</p>
    <h3>How it's going</h3><table><tr><th>Skill</th><th class="n">Level</th><th class="n">Last 20</th><th class="n">Tries</th></tr>${rows}</table>
    <h3>Tricky facts</h3><div class="chips">${tricky || '<span class="sub">None yet. Missed facts show up here and come back more often.</span>'}</div>
    <h3>Recent days</h3>${days || '<p class="sub">No play yet.</p>'}
    <h3>Settings</h3>
    ${tg('voice', 'Read aloud', 'Rules, coaching and questions are spoken')}
    ${tg('sound', 'Sound effects')}
    ${tg('mistakes', 'Mistakes cost ½ heart', 'Off = gentle mode: wrong answers only coach')}
    ${tg('monsters', 'Monsters', 'Off = calm rooms with no wandering monsters')}
    ${tg('readTiles', 'Read each tile when stepped on', 'Extra support for early readers')}
    <h3>Skills in the mix</h3>${Object.keys(SKILLS).map(stg).join('')}
    <h3>How it teaches</h3><ul>
      <li>Uses Bridges' own models: ten-frames, the number rack, pairs, and number paths.</li>
      <li>Every mistake gets a named strategy (doubles, make ten, count on, think addition) with a picture.</li>
      <li>No timers. Monsters only move when she moves, so thinking time is unlimited.</li>
      <li>Adapts: a skill levels up at 90%+ and eases off below 60%. Missed facts come back more often (spaced practice).</li>
      <li>Mixes skills from room to room (interleaving), favoring weaker ones.</li>
      <li>Helper items are picture supports she finds mid-run; they reset each run so the support fades.</li>
      <li>Praise targets effort and strategy, and stars are always kept, even when a run ends.</li></ul>
    <div class="stack"><button class="btn mint" data-close>Done</button><button class="btn small ghost" data-act="reset">Reset all progress</button></div></div>`,
    { actions: { reset: el => { if (!el.dataset.armed) { el.dataset.armed = 1; el.textContent = 'Tap again to erase everything'; el.style.color = 'var(--red)'; return; }
        try { localStorage.removeItem(SAVE_KEY); } catch (e) {} save = defaultSave(); persist(); closeOverlay(); showTitle(); } },
      onChange: inp => { if (inp.dataset.set) save.settings[inp.dataset.set] = inp.checked; if (inp.dataset.skill) save.settings.skills[inp.dataset.skill] = inp.checked; persist(); } });
}

  if (!ptr || blocked()) { ptr = null; return; }
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y, p = ptr; ptr = null;
  if (Math.hypot(dx, dy) > 30) { Math.abs(dx) > Math.abs(dy) ? tryMove(Math.sign(dx), 0) : tryMove(0, Math.sign(dy)); return; }
  const r = $('#grid').getBoundingClientRect(), c = r.width / 5;

  if (cx < 0 || cy < 0 || cx > 4 || cy > 4) return;
  const ddx = cx - hero.x, ddy = cy - hero.y; if (!ddx && !ddy) return;

});

  const k = e.key, mv = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] }[k];

  else go();
});

$('#btn-closet').addEventListener('click', openCloset);
(() => {
