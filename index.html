<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Digit Dungeon">
<meta name="theme-color" content="#1b1426">
<title>Digit Dungeon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css?v15">
<link rel="stylesheet" href="css/skin.css?v15">
</head>
<body>
<div id="app">

<section id="scr-intro" class="screen">
  <div class="intro-box">
    <div class="intro-logo logo"><span>Digit</span><span>Dungeon</span></div>
    <div class="intro-frame">
      <video id="intro-video" playsinline preload="auto" poster="media/intro-poster.webp"></video>
      <button class="intro-skip" id="intro-skip" hidden>Skip ▶</button>
    </div>
    <button class="btn gold big" id="intro-play">▶ Play</button>
  </div>
</section>

<section id="scr-title" class="screen active">
  <div class="title-bg"></div>
  <div class="title-box">
    <div class="title-art"><img src="art/title.webp" alt="" draggable="false" onerror="document.getElementById('scr-title').classList.add('no-art')"><div class="logo"><span>Digit</span><span>Dungeon</span></div></div>
    <div class="title-who"><div class="title-hero" id="title-hero"></div><div class="title-name" id="title-name"></div></div>
    <div class="title-stats" id="title-stats"></div>
    <div class="title-btns">
      <button class="btn gold big" id="btn-continue" hidden>▶ Continue</button>
      <button class="btn mint big" id="btn-play">New Run</button>
      <button class="btn" id="btn-closet">👕 Closet<span class="cbadge" id="closet-badge" hidden></span></button>
    </div>
    <button class="grownups-btn" id="btn-grownups">⚙ Grown-ups · hold</button>
  </div>
</section>

<section id="scr-game" class="screen" data-floor="1">
  <header class="hud">
    <div class="hearts" id="hearts"></div>
    <div class="pill" id="coins"></div>
    <div class="pill" id="stars"></div>
    <div class="items" id="items"></div>
    <button class="glow-btn" id="btn-glow" hidden aria-label="Use flashlight"></button>
    <button class="icon-btn" id="btn-pause" aria-label="Pause">⏸</button>
  </header>
  <div class="rule" id="rule">
    <button class="say" id="btn-say" aria-label="Read the rule">🔊</button>
    <div class="rule-text"><small id="rule-small"></small><b id="rule-title"></b></div>
    <div class="pips" id="pips"></div>
  </div>
  <div class="stage" id="stage">
    <div class="room" id="room">
      <button class="door n" id="door-n" data-dir="n" aria-label="North door"></button>
      <button class="door e" id="door-e" data-dir="e" aria-label="East door"></button>
      <button class="door s" id="door-s" data-dir="s" aria-label="South door"></button>
      <button class="door w" id="door-w" data-dir="w" aria-label="West door"></button>
      <img class="pillar tl" src="art/props/pillar.webp" alt="" onerror="this.remove()"><img class="pillar tr" src="art/props/pillar.webp" alt="" onerror="this.remove()">
      <img class="pillar bl" src="art/props/pillar.webp" alt="" onerror="this.remove()"><img class="pillar br" src="art/props/pillar.webp" alt="" onerror="this.remove()">
      <img class="torch l" src="art/props/torch.webp" alt="" onerror="this.remove()"><img class="torch r" src="art/props/torch.webp" alt="" onerror="this.remove()">
      <div class="grid" id="grid"></div>
      <div class="marks" id="marks"></div>
      <div class="marks"><div class="goal" id="goal" hidden></div></div>
      <div class="actors" id="actors"></div>
      <div class="room-msg" id="room-msg"></div>
    </div>
  </div>
  <div class="infobar">
    <div class="peek" id="peek"></div>
    <div class="mapbox" id="minimap"></div>
  </div>
  <div class="controls">
    <div class="dpad">
      <button class="dbtn up" data-move="0,-1" aria-label="Up">▲</button>
      <button class="dbtn left" data-move="-1,0" aria-label="Left">◀</button>
      <button class="dbtn right" data-move="1,0" aria-label="Right">▶</button>
      <button class="dbtn down" data-move="0,1" aria-label="Down">▼</button>
    </div>
    <div class="act">
      <button class="chomp" id="btn-chomp"><span class="mouth"></span>CHOMP</button>
    </div>
  </div>
</section>

<div class="overlay" id="ov"><div class="card" id="ov-card"></div></div>
<div class="toast" id="toast"></div>
<div class="banner" id="banner"></div>
<div class="fx" id="fx"></div>
</div>

<script src="audio/voice.js?v15"></script>
<script src="js/core.js?v15"></script>
<script src="js/curriculum.js?v15"></script>
<script src="js/coaching.js?v15"></script>
<script src="js/art.js?v15"></script>
<script src="js/powers.js?v15"></script>
<script src="js/dungeon.js?v15"></script>
<script src="js/play.js?v15"></script>
<script src="js/render.js?v15"></script>
<script src="js/ui.js?v15"></script>
</body>
</html>
